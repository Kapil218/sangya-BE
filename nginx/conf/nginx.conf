worker_processes  1;

error_log  logs/error.log info;

events {
    worker_connections  1024;
}

rtmp {
    server {
        listen 1935;

        # RTMP app for direct streaming (VLC, OBS preview, etc.)
        application live {
            live on;
        }

        # RTMP → HLS app
        application hls {
            live on;
            hls on;  
            hls_cleanup on;
            # hls_path temp/hls/$name; ---> stream key 
            hls_path temp/hls;      # Make sure this folder exists
            hls_fragment 2s; 
            hls_playlist_length 20s;         # Segment duration
        }
    }
}

http {
    server {
        listen 8080;

        # Default root
        location / {
            root html;
        }

        # RTMP stats
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root html;
        }

        # HLS streaming location with CORS headers
        location /hls {  
            types {  
                application/vnd.apple.mpegurl m3u8;  
                video/mp2t ts;  
            }  
            alias temp/hls;  
            expires -1;  

            # CORS headers for browser access
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;

            # Optional: handle OPTIONS preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }  
    }
}
